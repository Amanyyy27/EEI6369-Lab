name: AWS DevSecOps Pipeline

on:
  push:
    branches:
      - main
      - jobs
  pull_request:
    branches:
      - main

jobs:
  build-and-secure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: SonarCloud SAST Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn verify sonar:sonar -Dsonar.organization=amanyyy27

      - name: Build Container Image
        run: |
          docker build -t ousl-student-api:${{ github.sha }} .

      - name: Aqua Security Trivy Scan
        uses: aquasecurity/trivy-action@v0.31.0
        with:
          image-ref: 'ousl-student-api:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_ID }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Container Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag ousl-student-api:${{ github.sha }} \
            $ECR_REGISTRY/ousl-student-api:${{ github.sha }}

          docker push \
            $ECR_REGISTRY/ousl-student-api:${{ github.sha }}
